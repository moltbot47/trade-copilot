name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------
  # Lint — backend (ruff) + frontend (eslint, soft-fail)
  # -------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      - name: Ruff check (backend)
        run: ruff check backend/ --output-format=github

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend lint (next lint, soft-fail until config lands)
        working-directory: frontend
        run: npx next lint || echo "::warning::eslint config not yet configured — skipping"

  # -------------------------------------------------
  # Mypy — backend static type-checking (fail-on-error)
  # -------------------------------------------------
  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "mypy>=1.10.0" types-python-jose

      - name: Run mypy
        working-directory: backend
        run: mypy app/

  # -------------------------------------------------
  # Test — backend pytest + frontend vitest (if present)
  # -------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest (with coverage gate)
        working-directory: backend
        env:
          SECRET_KEY: ci_secret_do_not_use_in_prod_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          ENCRYPTION_KEY: ci_dummy_fernet_key_replace_in_real_envxxxxx=
          DATABASE_URL: "sqlite:///./test_ci.db"
        # Coverage gate: fail if overall app/ line coverage drops below 73%.
        # Current measured: 75% (2026-05-10). Threshold is set 2pp below the
        # measured value so future PRs are expected to maintain or improve
        # coverage. Raise this number as coverage improves; do not lower it.
        run: |
          if [ -d tests ] || compgen -G "test_*.py" > /dev/null || compgen -G "**/test_*.py" > /dev/null; then
            pytest -q --cov=app --cov-report=term --cov-fail-under=73
          else
            echo "::warning::no backend tests found — skipping"
          fi

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend tests (vitest if configured)
        working-directory: frontend
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test -- --run || npm test
          else
            echo "::warning::no frontend test script — skipping"
          fi

  # -------------------------------------------------
  # E2E — Playwright tests against a mocked backend
  # -------------------------------------------------
  e2e-tests:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers (chromium only, with OS deps)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # -------------------------------------------------
  # Docker build matrix — verify both images build clean
  # -------------------------------------------------
  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: Dockerfile.backend
            tag: trade-copilot-backend:ci
          - image: frontend
            dockerfile: Dockerfile.frontend
            tag: trade-copilot-frontend:ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # -------------------------------------------------
  # Staging smoke test — prod-deploy GUARDRAIL.
  # On push to main, after lint/test/docker-build all pass, verify the
  # staging Fly app is responding 200 OK on /health. If staging is down
  # we fail the workflow so the prod deploy step (manual or future
  # automated) sees a red main and refuses to ship.
  #
  # This job only runs on pushes to main, not on PRs — PR builds
  # shouldn't be blocked by a staging outage.
  # -------------------------------------------------
  staging-smoke-test:
    name: Staging smoke test (prod gate)
    runs-on: ubuntu-latest
    needs: [lint, test, e2e-tests, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Probe staging /health
        run: |
          set -e
          url="https://trade-copilot-api-staging.fly.dev/health"
          echo "Probing $url ..."
          # Retry a few times to tolerate brief blips. Total budget ~50s.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 10 "$url" || echo "000")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "staging /health OK — prod deploy is gated open"
              cat /tmp/body || true
              exit 0
            fi
            sleep 10
          done
          echo "::error::staging /health did not return 200 — BLOCKING prod deploy"
          echo "::error::Last response body:"
          cat /tmp/body || true
          exit 1
