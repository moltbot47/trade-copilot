# fly.staging.toml — Trade Copilot backend STAGING deploy config
#
# This is the staging mirror of /fly.toml. Deployed by
# .github/workflows/deploy-staging.yml on push to the `staging`
# branch or via manual workflow_dispatch.
#
# IMPORTANT: this file lives in backend/ but the Dockerfile lives at
# the repo root. The deploy workflow runs from the repo root and
# passes `--config backend/fly.staging.toml --dockerfile Dockerfile.backend .`
# so the build context is the repo root (same as prod).
app = "trade-copilot-api-staging"
primary_region = "iad"  # match prod region for parity

[build]
dockerfile = "../Dockerfile.backend"

[env]
PORT = "8000"
DATABASE_URL = "sqlite:////app/data/trade_copilot.db"
ENVIRONMENT = "staging"
TRADELOCKER_API_BASE = "https://live.tradelocker.com/backend-api"
TRADELOCKER_DEMO_API_BASE = "https://demo.tradelocker.com/backend-api"
BUY_ME_COFFEE_USERNAME = "dbutler"
ALLOWED_ORIGINS = "https://staging-trading.jetlag-recovery.com,http://localhost:3001"
SESSION_COOKIE_SECURE = "true"

[http_service]
internal_port = 8000
force_https = true
# Same always-on policy as prod: the QuantRunner asyncio task lives
# in-process. Even on staging we need a warm machine so smoke tests
# and any staging-bot positions stay managed.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

  [http_service.concurrency]
  type = "requests"
  hard_limit = 200
  soft_limit = 100

[[http_service.checks]]
grace_period = "20s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[mounts]
source = "tc_data_staging"
destination = "/app/data"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
cpus = 1
