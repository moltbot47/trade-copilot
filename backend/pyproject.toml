[project]
name = "trade-copilot-backend"
version = "0.1.0"
description = "Trade Copilot — automated trading SaaS backend"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "types-python-jose",
]

[tool.mypy]
python_version = "3.11"
files = ["app"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

# Third-party libs without proper stubs in our env.
[[tool.mypy.overrides]]
module = [
    "slowapi",
    "slowapi.*",
    "respx",
    "reportlab",
    "reportlab.*",
    "sentry_sdk",
    "sentry_sdk.*",
    "prometheus_client",
    "prometheus_client.*",
    "structlog",
    "structlog.*",
    "jose",
    "jose.*",
    "bcrypt",
    "cryptography",
    "cryptography.*",
    "psycopg2",
    "psycopg2.*",
    "pandas",
    "pandas.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true

[tool.ruff]
# Project-wide ruff config. Source code in `app/` is held to the default
# strict ruleset; test files allow compact compound statements and
# late-bound imports that are common in pytest setups.

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E402",  # imports after non-import code — common for SQLAlchemy declarative setup in tests
    "E702",  # multi-statement on one line — common for compact User(...).flush() setup
    "E741",  # short loop names like `l`, `e` — fine in test scaffolding
    "F401",  # unused imports — fixtures may register side-effects on import
    "F841",  # unused locals — assignments for readability
]
"scripts/**/*.py" = [
    "E402",
    "E702",
    "E741",
    "F401",
    "F541",  # f-strings without placeholders — log message scaffolds
    "F841",
]
