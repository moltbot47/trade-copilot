# fly.toml — Trade Copilot backend deploy config
app = "trade-copilot-api"
primary_region = "iad"  # Ashburn VA — close to Genesis FX servers (US East)

[build]
dockerfile = "Dockerfile.backend"

[env]
PORT = "8000"
DATABASE_URL = "sqlite:////app/data/trade_copilot.db"
ENVIRONMENT = "production"
TRADELOCKER_API_BASE = "https://live.tradelocker.com/backend-api"
TRADELOCKER_DEMO_API_BASE = "https://demo.tradelocker.com/backend-api"
BUY_ME_COFFEE_USERNAME = "dbutler"
ALLOWED_ORIGINS = "https://trading.jetlag-recovery.com"
SESSION_COOKIE_SECURE = "true"

[http_service]
internal_port = 8000
force_https = true
# Always-on: the QuantRunner asyncio task lives in-process. If the
# machine sleeps, the runner dies and open positions are unmanaged.
# For live trading this is non-negotiable. Realistic cost: $0–3/mo
# at free-tier limits.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1         # keep 1 machine warm 24/7
processes = ["app"]

  [http_service.concurrency]
  type = "requests"
  hard_limit = 200
  soft_limit = 100

[[http_service.checks]]
grace_period = "20s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[mounts]
source = "tc_data"
destination = "/app/data"

[[vm]]
size = "shared-cpu-1x"
# Bumped 256MB → 1024MB on 2026-05-11. The 256MB box was OOM-thrashing
# under combined load (uvicorn + pandas + Discord gateway + WS relay +
# strategy runner). Memory pressure made the asyncio loop unresponsive,
# Fly's /health probe timed out, and the LB stopped routing traffic.
# 1GB gives every process room to live without competing for pages.
# Cost delta: ~+$1.50/mo.
memory = "1024mb"
cpus = 1
