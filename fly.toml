# fly.toml — Trade Copilot backend deploy config
app = "trade-copilot-api"
primary_region = "iad"  # Ashburn VA — close to Genesis FX servers (US East)

[build]
dockerfile = "Dockerfile.backend"

[env]
PORT = "8000"
DATABASE_URL = "sqlite:////app/data/trade_copilot.db"
ENVIRONMENT = "production"
TRADELOCKER_API_BASE = "https://live.tradelocker.com/backend-api"
TRADELOCKER_DEMO_API_BASE = "https://demo.tradelocker.com/backend-api"
BUY_ME_COFFEE_USERNAME = "dbutler"
ALLOWED_ORIGINS = "https://trading.jetlag-recovery.com"
SESSION_COOKIE_SECURE = "true"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"     # Free-tier friendly: stop after idle
auto_start_machines = true
min_machines_running = 0         # Scale to zero when idle
processes = ["app"]

  [http_service.concurrency]
  type = "requests"
  hard_limit = 200
  soft_limit = 100

[[http_service.checks]]
grace_period = "20s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[mounts]
source = "tc_data"
destination = "/app/data"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
cpus = 1
