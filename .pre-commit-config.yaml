# Pre-commit hooks for Trade Copilot
# Install:    pip install pre-commit && pre-commit install
# Run all:    pre-commit run --all-files
# Skip once:  git commit --no-verify   (emergencies only)
#
# Notes:
# - ruff handles lint + format on staged backend/ Python files
# - mypy runs against backend/app/ using the backend venv (so it picks up the
#   project's installed type stubs / settings from backend/pyproject.toml)
# - smoke test runs the two fastest tests (health + jwt) to catch import-time
#   regressions in <5s without spinning the full suite
default_language_version:
  python: python3.11

default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # Standard hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  # frozen: 2024-04-06
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        # Allow multi-document YAML (k8s manifests, etc.)
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # ---------------------------------------------------------------------------
  # Ruff: lint + format Python (backend/)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9  # frozen: 2024-10-01
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff (format)
        files: ^backend/.*\.py$

  # ---------------------------------------------------------------------------
  # mypy: type-check backend/app/
  # Uses the project's venv so it picks up installed deps + stubs.
  # Runs against the whole `app/` package (not just staged files) so
  # cross-module type errors are caught — but only triggers when a .py file
  # under backend/ is staged.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend/app)
        entry: bash -c 'cd backend && source venv/bin/activate && mypy app/'
        language: system
        types: [python]
        files: ^backend/.*\.py$
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Fast smoke test: import-time regression catch (<5s).
  # If health + jwt tests pass, the app boots and core auth wiring works.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest smoke (health + jwt)
        entry: bash -c 'cd backend && source venv/bin/activate && pytest tests/test_health.py tests/test_jwt.py -q'
        language: system
        types: [python]
        files: ^backend/.*\.py$
        pass_filenames: false
        stages: [pre-commit]
